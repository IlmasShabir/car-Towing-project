server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Known React client-side routes — always serve index.html with HTTP 200.
    # /services/* covers dynamic detail pages (e.g. /services/emergency-towing).
    location ~ ^/(about|services|coverage-areas|contact|reviews|faq|admin) {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — serve directly with long cache.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Root path.
    location = / {
        try_files /index.html =404;
    }

    # SPA catch-all — file not found → serve React app with real HTTP 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # 404 error page: serve React's index.html, preserving the 404 status code.
    error_page 404 =404 /index.html;

    # Exact-match catch for the error_page redirect above.
    # Without this, /index.html falls into `location /` where try_files
    # finds the file and resets the status to 200, discarding the =404.
    location = /index.html {
    }
}
