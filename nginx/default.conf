server {
    listen 80;
    server_name cartowingservicedubai.com www.cartowingservicedubai.com;

    # Certbot writes its challenge files here. Must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cartowingservicedubai.com www.cartowingservicedubai.com;

    ssl_certificate     /etc/letsencrypt/live/cartowingservicedubai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cartowingservicedubai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    # Use Docker DNS resolver (127.0.0.11) for runtime service discovery
    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream_client http://client:80;
        proxy_pass $upstream_client;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $upstream_server http://server:5000;
        proxy_pass $upstream_server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $upstream_server http://server:5000;
        proxy_pass $upstream_server/health;
    }
}
