# STEP 1 (first boot, before you have a certificate): leave this file as-is.
# STEP 2 (after certbot succeeds): uncomment the 443 block below and the redirect
#         line in the port-80 block, then `docker compose restart nginx`.

server {
    listen 80;
    server_name wwwdubaicartowingservice.com www.wwwdubaicartowingservice.com;

    # Certbot writes its challenge files here. Must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- STEP 2: uncomment these two lines, and delete everything below them ---
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    location / {
        proxy_pass http://client:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://server:5000/health;
    }
}

